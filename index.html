  #leaders .ldr{ stroke-width:.7; opacity:.35; }

  #legend .li.active{ color:var(--gold-d); }
  #leaders{ position:absolute; left:0; top:0; overflow:visible; }
  #leaders .ldr{ fill:none; stroke:var(--gold); stroke-width:1.3; opacity:.9; }
  #leaders .ldr.active{ stroke:var(--gold-d); stroke-width:2; }

  header{ position:absolute; left:16px; top:14px; display:flex; align-items:center; gap:12px; pointer-events:none; }

  header .t{ line-height:1.15; }
  header .t b{ display:block; font-family:var(--disp); font-weight:500; font-size:13px; letter-spacing:.28em; }
  header .t span{ font-size:12px; color:var(--mute); }

  #bar{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:stretch; gap:8px; padding:10px;
        background:rgba(12,14,24,.50); backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);

  .row.r1 .slw{ grid-column:3 / span 2; display:flex; align-items:center; padding:0 6px; }
  .row.r1 #btnExplode{ grid-column:1 / span 2; }
  .r3 .zoom{ grid-column:span 2; } .r3 #btnLabels{ grid-column:span 2; }
  .zoom{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button{ position:relative; overflow:hidden; font-family:var(--disp); font-size:11px; font-weight:400; letter-spacing:.26em; text-transform:uppercase; color:#f1e4cc; white-space:nowrap;

          border:1px solid rgba(255,255,255,.20); border-top-color:rgba(255,255,255,.38); border-bottom-color:rgba(255,255,255,.08); border-radius:3px; padding:10px 16px; cursor:pointer; min-height:40px;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.40);
